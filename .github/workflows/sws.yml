name: SWS-Waechter

# Ein Lauf prueft den Feed ca. 5,5 Stunden lang alle 5 Minuten
# und startet danach selbst den naechsten Lauf (Dauerschleife).
# Der Zeitplan ist nur Reserve, falls die Kette einmal abreisst.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Testmeldung an Prowl senden"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: sws
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Testmeldung
        if: ${{ inputs.test }}
        env:
          PROWL_API_KEY: ${{ secrets.PROWL_API_KEY }}
          SWS_TEST: "1"
        run: php sws-prowl.php

      - name: Feed alle 5 Minuten pruefen
        if: ${{ !inputs.test }}
        env:
          PROWL_API_KEY: ${{ secrets.PROWL_API_KEY }}
        run: |
          git config user.name "sws-waechter"
          git config user.email "actions@users.noreply.github.com"
          ende=$((SECONDS + 19800))
          while [ $SECONDS -lt $ende ]; do
            echo "--- Pruefung $(date -u +%H:%M) UTC"
            php sws-prowl.php || echo "Pruefung fehlgeschlagen, naechster Versuch in 5 Minuten"
            if [ -n "$(git status --porcelain sws-prowl-state.json)" ]; then
              git add sws-prowl-state.json
              git commit -q -m "Stand aktualisiert"
              git pull -q --rebase && git push -q || echo "Push fehlgeschlagen"
            fi
            sleep 300
          done

      - name: Naechsten Lauf starten
        if: ${{ !inputs.test && always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sws.yml --ref main --repo ${{ github.repository }}
