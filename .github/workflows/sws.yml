name: SWS-Waechter

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Testmeldung an Prowl senden"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sws
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Feed pruefen
        env:
          PROWL_API_KEY: ${{ secrets.PROWL_API_KEY }}
          SWS_TEST: ${{ inputs.test && '1' || '0' }}
        run: php sws-prowl.php
      - name: Stand speichern
        run: |
          if [ -n "$(git status --porcelain sws-prowl-state.json)" ]; then
            git config user.name "sws-waechter"
            git config user.email "actions@users.noreply.github.com"
            git add sws-prowl-state.json
            git commit -m "Stand aktualisiert"
            git pull --rebase
            git push
          fi
